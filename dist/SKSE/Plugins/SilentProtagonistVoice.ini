[General]
bEnabled = true

; NPC replies only after your character finishes
bNpcWaitsForPlayer = true

; clicking while your character hums skips to the NPC
bClickToSkip = true

; longest a single player line may run
fMaxLineSeconds = 6
fResponseDelay = 0.12


[Voice]

; folder names under Data\Sound\FX\SilentProtagonistVoice\voices
sPackMale = SuddenDiceMale_AS049690
sPackFemale = SuddenDiceFemale_AS000834

; 0 = auto, 1 = babble, 2 = phrase
iMode = 0
fVolume = 0.85
bFollowVoiceSlider = true
fPitch = 1
fPitchVariation = 0.06
bIntonation = true


[Character]

; -1 small/young .. +1 large/deep (Processed playback)
fThroat = 0

; 0 clear .. 1 whisper (Processed playback)
fBreath = 0

; -1 dark .. +1 bright (Processed playback)
fBrightness = 0

; 0 monotone .. 2 very animated
fExpression = 1


[Emotion]

; 0 = off, 1 = speech-check tags only, 2 = tags + mood of the NPC's reply
iSource = 2
fIntensity = 1

; reply emotion (0-100) below this counts as neutral
iThreshold = 25

; 0 = off, 1 = short lines, 2 = short lines + lead-in for long lines
iReactions = 2
bFaceExpression = true
fFaceIntensity = 0.6


[Babble]
fSyllablesPerBlip = 1.6
fSpeed = 1
iMaxBlips = 22
fCommaPause = 0.14
fOverlap = 0.12
; processed playback: babble syllables ring softly into each other (0 = clips as recorded)
fBlend = 0.7


[Phrase]
iShortMaxSyllables = 4
iMediumMaxSyllables = 12
bChainLongLines = true


[LipSync]
bEnabled = true
fGain = 1
fJawOpen = 0.7
bVowelShapes = true
bExpressiveBrows = true
fSmoothing = 0.035


[Advanced]

; 0 = processed (full voice shaping), 1 = game sound engine, 2 = AudioUtil
iPlayback = 0
bDebugLog = false
